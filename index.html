
<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>ASCII Text tree generator</title>
    <meta name="description"
        content="Generate a text (ASCII) tree online to document directory/folder structure and hierarchies for your markdown projects." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
        :root {
            --bg-color: #0b0f19;
            --surface-color: rgba(17, 24, 39, 0.7);
            --accent-color: #818cf8;
            --accent-glow: rgba(129, 140, 248, 0.2);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.08);
            --glass-bg: rgba(255, 255, 255, 0.03);
        }

        * {
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: 'Outfit', sans-serif;
            font-size: 62.5%;
            background-color: var(--bg-color);
            background-image:
                radial-gradient(at 0% 0%, rgba(129, 140, 248, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(167, 139, 250, 0.1) 0px, transparent 50%);
            color: var(--text-main);
            overflow-x: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header {
            width: 100%;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(11, 15, 25, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header__logo {
            font-size: 2.8rem;
            font-weight: 600;
            margin: 0;
            background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
        }

        .content {
            flex: 1;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .content__main {
            width: 100%;
            max-width: 1400px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            height: calc(100vh - 240px);
            min-height: 500px;
        }

        @media (max-width: 1024px) {
            .inputs {
                grid-template-columns: 1fr;
                height: auto;
            }
        }

        .inputs__container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            height: 100%;
        }

        .inputs__label {
            font-size: 1.6rem;
            color: var(--text-muted);
            font-weight: 500;
            padding-left: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .inputs__label::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-color);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .textarea-wrapper {
            flex: 1;
            position: relative;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.3);
        }

        .textarea-wrapper:focus-within {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px var(--accent-glow), 0 10px 30px -10px rgba(0, 0, 0, 0.3);
        }

        .inputs__input {
            width: 100%;
            height: auto;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: monospace;
            font-size: 1.5rem;
            line-height: 2.4rem;
            /* Fixed line height for calculation */
            resize: none;
            outline: none;
            padding: 10px;
            white-space: pre;
            overflow-wrap: normal;
            overflow-x: auto;

            /* Line highlight setup */
            background-image: linear-gradient(rgba(129, 140, 248, 0.1), rgba(129, 140, 248, 0.1));
            background-size: 100% 2.4rem;
            background-repeat: no-repeat;
            background-attachment: local;
            background-position: 0 -2.4rem;
            /* Start invisible */
            background-origin: content-box;
        }

        .inputs__input::-webkit-scrollbar {
            width: 6px;
        }

        .inputs__input::-webkit-scrollbar-track {
            background: transparent;
        }

        .inputs__input::-webkit-scrollbar-thumb {
            background-color: var(--border-color);
            border-radius: 10px;
        }

        /* Custom placeholder */
        .inputs__input::placeholder {
            color: #4b5563;
        }

        .footer {
            padding: 20px;
            text-align: center;
            font-size: 1.3rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            background: rgba(11, 15, 25, 0.5);
        }

        /* Animation for labels */
        @keyframes pulse {
            0% {
                opacity: 0.6;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.6;
            }
        }

        .inputs__label::before {
            animation: pulse 2s infinite;
        }
    </style>
</head>

<body>
    <div class="container">
        <header class="header">
            <h1 class="header__logo">TreeFlow</h1>
        </header>
        <div class="content">
            <main class="content__main">
                <div class="inputs">
                    <div class="inputs__container">
                        <label for="text" class="inputs__label">Source Text</label>
                        <div class="textarea-wrapper">
                            <textarea id="text" class="inputs__input" placeholder="Type or paste your structure here...
Folder
=Subfolder
==File.txt
=Another Folder"></textarea>
                        </div>
                    </div>
                    <div class="inputs__container">
                        <label for="tree" class="inputs__label">ASCII Tree</label>
                        <div class="textarea-wrapper">
                            <textarea id="tree" class="inputs__input" placeholder="Tree will appear here..."></textarea>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script defer="defer">
        (() => {
            const e = document.getElementById("text"),
                t = document.getElementById("tree");
            function l() {
                let l = "";
                const n = e.value.split("\n").reverse();
                let o = null,
                    c = {};
                for (let e = 0; e < n.length; e++) {
                    const t = n[e].match(/^(=*)([^=].*)/);
                    if (null === t) continue;
                    const i = t[1].length,
                        a = t[2].trim();
                    let r = "";
                    r = 0 === i ? "" : void 0 === c[i] ? "└── " : "├── ";
                    for (let e = i - 1; e > 0; e--) r = !0 === c[e] ? "│   " + r : "    " + r;
                    (l = r + a + "\n" + l), (c[i] = !0);
                    for (const e in c) e > i && delete c[e];
                    o = i;
                }
                (t.value = l.trim()),
                    (function (t) {
                        const l = e.offsetHeight - e.clientHeight,
                            n = t.scrollHeight + l;
                        n > 300 && (t.style.height = n + "px");
                    })(e),
                    (t.style.height = e.style.height);
                adjustHeight(e);
                adjustHeight(t);
            }
            e.addEventListener("input", l),
                t.addEventListener("input", function () {
                    e.value = t.value
                        .replaceAll("├──", "=")
                        .replaceAll("│   ", "=")
                        .replaceAll("└──", "=")
                        .replaceAll("    ", "=");
                    adjustHeight(e);
                    adjustHeight(t);
                });

            // Synchronized line highlight
            function syncHighlight(lineIndex) {
                const lineHeight = 24; // 2.4rem * 10
                const offset = (lineIndex * lineHeight) + 'px';
                e.style.backgroundPositionY = offset;
                t.style.backgroundPositionY = offset;
            }

            function updateHighlightFrom(el) {
                const textBefore = el.value.substring(0, el.selectionStart);
                const lineIndex = textBefore.split('\n').length - 1;
                syncHighlight(lineIndex);
            }

            [e, t].forEach(el => {
                ['click', 'keyup', 'focus', 'input'].forEach(evt => {
                    el.addEventListener(evt, () => updateHighlightFrom(el));
                });

                // Keep highlights visible when switching focus between the two
                el.addEventListener('blur', (evt) => {
                    if (evt.relatedTarget !== e && evt.relatedTarget !== t) {
                        e.style.backgroundPositionY = '-2.4rem';
                        t.style.backgroundPositionY = '-2.4rem';
                    }
                });
            });

            (function () {
                const t = localStorage.getItem("savedTree");
                null !== t && (e.value = t);
            })(),
                l(),
                addEventListener("beforeunload", function () {
                    localStorage.setItem("savedTree", e.value);
                });
        })();

        function adjustHeight(el) {
            el.style.height = 'auto'; // Reset chiều cao để đo lại
            el.style.height = (el.scrollHeight + 20) + 'px';
        }
    </script>
</body>

</html>
