<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>ASCII Text tree generator</title>
    <meta name="description"
        content="Generate a text (ASCII) tree online to document directory/folder structure and hierarchies for your markdown projects." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <div class="container">
        <header class="header">
            <h1 class="header__logo">TreeFlow</h1>
            <button type="button" id="layout-toggle" class="header__toggle" aria-pressed="false"
                title="Switch between side-by-side and stacked layout">Stacked view</button>
        </header>
        <div class="content">
            <main class="content__main">
                <div class="inputs" id="inputs">
                    <div class="inputs__container">
                        <label for="text" class="inputs__label">Source Text</label>
                        <div class="textarea-wrapper">
                            <textarea id="text" class="inputs__input" placeholder="Type or paste your structure here...
Folder
=Subfolder
==File.txt
=Another Folder"></textarea>
                        </div>
                    </div>
                    <div class="inputs__container">
                        <label for="tree" class="inputs__label">ASCII Tree</label>
                        <div class="textarea-wrapper">
                            <textarea id="tree" class="inputs__input" placeholder="Tree will appear here..."></textarea>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script type="module" src="js/main.js"></script>
</body>

</html>
